name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: mshauri
          POSTGRES_PASSWORD: mshauri
          POSTGRES_DB: mshauri
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mshauri -d mshauri"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://mshauri:mshauri@localhost:5432/mshauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy --strict app tests
      - name: Test
        run: pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t mshauri:ci .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 mshauri:ci
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1
